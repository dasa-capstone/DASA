# Tool configuration. Dev tooling is pinned in requirements-dev.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["results", "runs", "handover"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["handover", ".venv", "results", "runs", ".git", "node_modules"]  # never collect local/handover files
addopts = "-q --strict-markers"
markers = ["sim: needs the simulator container; excluded from `make test`"]
